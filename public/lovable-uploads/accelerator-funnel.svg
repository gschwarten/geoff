<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, system-ui, -apple-system, sans-serif">
  <rect width="1600" height="900" fill="#f4f9ff"/>

  <!-- BEFORE label -->
  <text x="120" y="150" font-size="26" font-weight="700" fill="#64748b" letter-spacing="3">BEFORE</text>

  <!-- BEFORE boxes -->
  <rect x="120" y="180" width="280" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="260" y="248" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">LinkedIn ad</text>

  <!-- arrow 1 -->
  <line x1="400" y1="240" x2="500" y2="240" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="500,240 485,230 485,250" fill="#94a3b8"/>

  <rect x="510" y="180" width="280" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="650" y="248" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">Landing page</text>

  <!-- arrow 2 -->
  <line x1="790" y1="240" x2="890" y2="240" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="890,240 875,230 875,250" fill="#94a3b8"/>

  <rect x="900" y="180" width="280" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1040" y="248" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">Application</text>

  <!-- drop-off note -->
  <text x="650" y="350" text-anchor="middle" font-size="28" font-weight="600" fill="#dc2626" opacity="0.8">90%+ drop-off</text>

  <!-- divider -->
  <line x1="120" y1="430" x2="1480" y2="430" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="10 12"/>

  <!-- AFTER label -->
  <text x="120" y="520" font-size="26" font-weight="700" fill="#2563eb" letter-spacing="3">AFTER</text>

  <!-- AFTER boxes -->
  <rect x="120" y="550" width="280" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="260" y="618" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">LinkedIn ad</text>

  <!-- long arrow -->
  <line x1="400" y1="610" x2="900" y2="610" stroke="#2563eb" stroke-width="5"/>
  <polygon points="900,610 880,598 880,622" fill="#2563eb"/>

  <rect x="910" y="550" width="280" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1050" y="618" text-anchor="middle" font-size="30" font-weight="600" fill="#0f172a">Application</text>

  <!-- callout -->
  <rect x="1230" y="540" width="300" height="150" rx="18" fill="#2563eb"/>
  <text x="1380" y="610" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">~2x completed</text>
  <text x="1380" y="652" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">applications</text>
  <text x="1380" y="678" text-anchor="middle" font-size="18" fill="#dbeafe">vs. prior cohort peak</text>
</svg>
